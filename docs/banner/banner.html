<!doctype html><meta charset=utf-8>
<style>
@font-face{font-family:"Bodoni Moda";src:url("../../assets/BodoniModa-500.woff2");font-weight:500}
html,body{margin:0;width:1600px;height:640px;background:#070b12;overflow:hidden}
#s{position:relative;width:1600px;height:640px;display:flex;align-items:center;justify-content:center;gap:64px;color:#e7ecf3;font-family:Arial,sans-serif;
 background:radial-gradient(ellipse at 30% 50%,#0d1626 0%,#070b12 70%)}
.bw{position:relative;display:flex;align-items:center;justify-content:center}
.glow{position:absolute;width:620px;height:620px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;
 background:radial-gradient(circle,rgba(236,140,70,.22) 0%,rgba(80,120,150,.18) 45%,transparent 70%);filter:blur(10px)}
.brain{position:relative;width:440px;height:auto}
.word{position:relative}
.name{font-family:"Bodoni Moda",Georgia,serif;font-weight:500;font-size:132px;line-height:1;letter-spacing:.5px}
.tag{margin-top:22px;font-size:27px;letter-spacing:.32em;text-transform:uppercase;color:#e7ecf3}
.sub{margin-top:34px;font-size:22px;line-height:1.5;color:#919fb2;max-width:640px}
.credit{margin-top:30px;font-size:20px;letter-spacing:.18em;color:#c3b38e}
.rule{width:96px;height:2px;background:#c3b38e;opacity:.7;margin-top:34px}
</style>
<div id=s><div class=bw><div class=glow></div><img class=brain src="../../assets/logo_brain.webp"></div>
<div class=word><div class=name>EpiScope</div><div class=tag>Visualize seizures</div><div class=rule></div>
<div class=sub>Multimodal data visualisation for epilepsy surgery: semiology, EEG, SEEG and imaging in one offline file.</div>
<div class=credit>Lucas Gauer</div></div></div>
